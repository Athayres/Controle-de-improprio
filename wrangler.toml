name = "controle-de-improprio"
main = "index.js"
compatibility_date = "2026-01-01"

# Mantém no deploy as variáveis/secrets cadastrados no painel (TMDB_KEY, MDBLIST_KEY...)
keep_vars = true

# Guarda os aparelhos registrados, o guia dos pais, a classificação e a sinopse de forma permanente.
[[kv_namespaces]]
binding = "KV"
id = "1cd06a5363d1444fa7bcf08be3926a6f"


# Ligação interna com o Worker do verificador-videos (a Cloudflare bloqueia Worker chamando Worker pelo workers.dev: erro 1042).
# "service" é o nome do Worker do verificador (o que aparece no endereço dele: verificador-videos.<sua-conta>.workers.dev).
[[services]]
binding = "VERIFICADOR"
service = "verificador-videos"
