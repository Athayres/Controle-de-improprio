name = "controle-de-improprio"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = true

# Cache e aparelhos registrados.
# Crie em: Cloudflare > Storage & Databases > KV > Create, e cole o ID abaixo.
[[kv_namespaces]]
binding = "KV"
id = "COLE_AQUI_O_ID_DO_KV"
